name: ClaimShield External Verifiers

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: read
  id-token: write

concurrency:
  group: claimshield-verifier
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      NLTK_DATA: /home/runner/nltk_data
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Cache Hugging Face models
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            .cache/huggingface
          key: claimshield-models-v1-${{ runner.os }}
          restore-keys: |
            claimshield-models-v1-

- name: Install verifier dependencies
  run: |
    pip install -r requirements.txt
    mkdir -p "$HOME/nltk_data"
    python -m nltk.downloader -d "$HOME/nltk_data" punkt punkt_tab
    python - <<'PY'
    import nltk
    print("NLTK search paths:", nltk.data.path)
    print("punkt:", nltk.data.find("tokenizers/punkt"))
    print("punkt_tab:", nltk.data.find("tokenizers/punkt_tab"))
    PY

      - name: Request GitHub OIDC token
        id: oidc
        shell: bash
        run: |
          TOKEN=$(curl -fsSL \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=claimshield-supabase" \
            | python -c "import json,sys; print(json.load(sys.stdin)['value'])")
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Verify next ClaimShield claim
        env:
          GITHUB_OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
          HF_HOME: .cache/huggingface
        run: python verifier_runner.py
